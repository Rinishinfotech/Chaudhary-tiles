name: Deploy Chaudhary Tiles

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chaudhary-tiles-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure VPS SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy

      - name: Deploy application to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/vps_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -e
          cd /opt/ct

          export GIT_SSH_COMMAND="ssh -i /root/.ssh/chaudhary_tiles_github -o IdentitiesOnly=yes"

          test -z "$(git status --porcelain)" || { echo "Deployment stopped: uncommitted VPS changes detected"; exit 1; }
          git fetch git@github.com:Rinishinfotech/Chaudhary-tiles.git main
          git merge --ff-only FETCH_HEAD

          docker compose build backend frontend
          docker compose up -d --no-deps backend frontend

          docker compose ps
          REMOTE
